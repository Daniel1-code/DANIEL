name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/ArmaturesPoteaux/ArmaturesPoteaux.csproj -c Release

      - name: Assemble le paquet d'installation
        shell: pwsh
        run: |
          $out = 'artifacts/ArmaturesPoteaux-Revit2026'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item src/ArmaturesPoteaux/bin/Release/ArmaturesPoteaux.dll $out
          Copy-Item install/ArmaturesPoteaux.addin $out
          Copy-Item install/Installer.ps1 $out
          Copy-Item README.md $out
          Compress-Archive -Path "$out/*" -DestinationPath 'artifacts/ArmaturesPoteaux-Revit2026.zip' -Force

      - name: Publie la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF_TYPE -ne 'tag') { $tag = "v1.0.$env:GITHUB_RUN_NUMBER" }
          gh release create $tag 'artifacts/ArmaturesPoteaux-Revit2026.zip' --title "Armatures de poteaux $tag - Revit 2026" --notes-file install/RELEASE_NOTES.md
